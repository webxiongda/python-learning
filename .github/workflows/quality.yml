name: learning-repo-quality

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile tools
        run: python -m py_compile tools/check_learning_repo.py tools/generate_missing_chapters.py tools/refresh_generic_chapters.py

      - name: Check learning repository
        run: python tools/check_learning_repo.py
